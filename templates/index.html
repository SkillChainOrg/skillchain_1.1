<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillChain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
    .container { max-width: 560px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab { padding: 8px 20px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; transition: all .15s; }
    .tab.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: white; border-radius: 12px; padding: 24px; border: 1px solid #e5e5e5; }
    label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; color: #444; }
    .file-drop { border: 1.5px dashed #ddd; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: border-color .15s; margin-bottom: 16px; }
    .file-drop:hover { border-color: #999; }
    .file-drop.has-file { border-color: #1a1a1a; border-style: solid; }
    .file-name { font-size: 13px; color: #666; margin-top: 8px; }
    select { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: white; margin-bottom: 16px; }
    button[type=submit] { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; background: #1a1a1a; color: white; border: none; border-radius: 8px; cursor: pointer; transition: opacity .15s; }
    button[type=submit]:hover { opacity: .85; }
    button[type=submit]:disabled { opacity: .4; cursor: default; }
    .result { margin-top: 20px; padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none; }
    .result.success { background: #f0faf5; border: 1px solid #5dcaa5; }
    .result.error { background: #fef2f2; border: 1px solid #fca5a5; }
    .result-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .result-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
    .result-row:last-child { border-bottom: none; }
    .result-label { color: #666; }
    .result-value { font-weight: 500; word-break: break-all; text-align: right; max-width: 60%; }
    .tx-link { color: #2563eb; text-decoration: none; }
    .tx-link:hover { text-decoration: underline; }
    .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <h1>SkillChain</h1>
  <p class="subtitle">Decentralized certificate verification on Algorand</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('issue')">Issue certificate</button>
    <button class="tab" onclick="switchTab('verify')">Verify certificate</button>
  </div>

  <div class="panel active" id="panel-issue">
    <div class="card">
      <label>Certificate file (PNG)</label>
      <div class="file-drop" id="issue-drop" onclick="document.getElementById('issue-file').click()">
        <div>Click to upload or drag and drop</div>
        <div class="file-name" id="issue-filename">No file selected</div>
      </div>
      <input type="file" id="issue-file" accept=".png,.jpg,.jpeg" style="display:none" onchange="handleFile(this, 'issue')">
      <label>Document type</label>
      <select id="issue-doctype">
        <option value="academic">Academic certificate</option>
        <option value="employment">Employment certificate</option>
        <option value="internship">Internship certificate</option>
      </select>
      <button type="submit" id="issue-btn" onclick="issuecert()" disabled>
        <span id="issue-label">Issue certificate</span>
        <div class="spinner" id="issue-spinner"></div>
      </button>
      <div class="result" id="issue-result"></div>
    </div>
  </div>

  <div class="panel" id="panel-verify">
    <div class="card">
      <label>Certificate file (PNG)</label>
      <div class="file-drop" id="verify-drop" onclick="document.getElementById('verify-file').click()">
        <div>Click to upload or drag and drop</div>
        <div class="file-name" id="verify-filename">No file selected</div>
      </div>
      <input type="file" id="verify-file" accept=".png,.jpg,.jpeg" style="display:none" onchange="handleFile(this, 'verify')">
      <button type="submit" id="verify-btn" onclick="verifycert()" disabled>
        <span id="verify-label">Verify certificate</span>
        <div class="spinner" id="verify-spinner"></div>
      </button>
      <div class="result" id="verify-result"></div>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
}

function handleFile(input, prefix) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById(prefix + '-filename').textContent = file.name;
  document.getElementById(prefix + '-drop').classList.add('has-file');
  document.getElementById(prefix + '-btn').disabled = false;
}

function setLoading(prefix, loading) {
  document.getElementById(prefix + '-btn').disabled = loading;
  document.getElementById(prefix + '-label').style.display = loading ? 'none' : 'inline';
  document.getElementById(prefix + '-spinner').style.display = loading ? 'block' : 'none';
}

function showResult(prefix, data, isIssue) {
  const el = document.getElementById(prefix + '-result');
  el.style.display = 'block';
  if (isIssue && data.success) {
    el.className = 'result success';
    el.innerHTML = `
      <div class="result-title">Certificate issued</div>
      <div class="result-row"><span class="result-label">Hash</span><span class="result-value">${data.cert_hash.slice(0,20)}...</span></div>
      <div class="result-row"><span class="result-label">Transaction</span><span class="result-value"><a class="tx-link" href="${data.explorer_url}" target="_blank">${data.tx_id.slice(0,16)}...</a></span></div>
    `;
  } else if (!isIssue && data.valid) {
    el.className = 'result success';
    el.innerHTML = `
      <div class="result-title">Certificate valid</div>
      <div class="result-row"><span class="result-label">Document type</span><span class="result-value">${data.doc_type}</span></div>
      <div class="result-row"><span class="result-label">Issued on</span><span class="result-value">${data.issued_at}</span></div>
      <div class="result-row"><span class="result-label">Confirmed at block</span><span class="result-value">${data.confirmed_round}</span></div>
      <div class="result-row"><span class="result-label">Transaction</span><span class="result-value"><a class="tx-link" href="${data.explorer_url}" target="_blank">${data.tx_id.slice(0,16)}...</a></span></div>
    `;
  } else {
    el.className = 'result error';
    el.innerHTML = `<div class="result-title">Invalid certificate</div><div>${data.reason || data.error || 'Verification failed'}</div>`;
  }
}

async function issuecert() {
  const file = document.getElementById('issue-file').files[0];
  const docType = document.getElementById('issue-doctype').value;
  if (!file) return;
  setLoading('issue', true);
  const form = new FormData();
  form.append('certificate', file);
  form.append('doc_type', docType);
  try {
    const res = await fetch('/issue', { method: 'POST', body: form });
    const data = await res.json();
    showResult('issue', data, true);
  } catch(e) {
    showResult('issue', { error: 'Request failed' }, true);
  }
  setLoading('issue', false);
}

async function verifycert() {
  const file = document.getElementById('verify-file').files[0];
  if (!file) return;
  setLoading('verify', true);
  const form = new FormData();
  form.append('certificate', file);
  try {
    const res = await fetch('/verify', { method: 'POST', body: form });
    const data = await res.json();
    showResult('verify', data, false);
  } catch(e) {
    showResult('verify', { error: 'Request failed' }, false);
  }
  setLoading('verify', false);
}
</script>
</body>
</html>
